name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux (VST3, tests, pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DSONICGRAIN_BUILD_TESTS=ON -DSONICGRAIN_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: |
          T=$(find build/Tests -name SonicGrainTests -type f -perm -u+x | head -1)
          "$T"
          "$T" --snap editor-linux.png
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          ./pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/SonicGrain_artefacts/$BUILD_TYPE/VST3/SONIC GRAIN.vst3"
      - name: Package
        run: |
          mkdir -p dist
          cd "build/SonicGrain_artefacts/$BUILD_TYPE/VST3" && zip -qr "$GITHUB_WORKSPACE/dist/SonicGrain-${GITHUB_REF_NAME//\//-}-Linux-VST3.zip" "SONIC GRAIN.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: SonicGrain-Linux
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot
          path: editor-linux.png

  macos:
    name: macOS (universal VST3 / AU / AAX, auval)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSONICGRAIN_BUILD_AAX=ON -DSONICGRAIN_BUILD_TESTS=ON -DSONICGRAIN_AAX_COPY_DIR="$PWD/build/aax-installed"
      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel 3 -- -quiet
      - name: Unit tests
        run: |
          T=$(find build/Tests -path "*$BUILD_TYPE*" -name SonicGrainTests -type f -perm -u+x | head -1)
          "$T"
      - name: Ad-hoc sign bundles
        run: |
          for b in build/SonicGrain_artefacts/$BUILD_TYPE/VST3/*.vst3 build/SonicGrain_artefacts/$BUILD_TYPE/AU/*.component \
                   ~/Library/Audio/Plug-Ins/VST3/"SONIC GRAIN.vst3" ~/Library/Audio/Plug-Ins/Components/"SONIC GRAIN.component"; do
            codesign --force --deep --sign - "$b"
          done
      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Sgrn Gsof
      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            ~/Library/Audio/Plug-Ins/VST3/"SONIC GRAIN.vst3"
      - name: Package
        run: |
          mkdir -p dist
          A=build/SonicGrain_artefacts/$BUILD_TYPE
          TAG="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent "$A/VST3/SONIC GRAIN.vst3" "dist/SonicGrain-$TAG-macOS-VST3.zip"
          ditto -c -k --keepParent "$A/AU/SONIC GRAIN.component" "dist/SonicGrain-$TAG-macOS-AU.zip"
          if [ -d "$A/AAX/SONIC GRAIN.aaxplugin" ]; then
            ditto -c -k --keepParent "$A/AAX/SONIC GRAIN.aaxplugin" "dist/SonicGrain-$TAG-macOS-AAX-unsigned.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SonicGrain-macOS
          path: dist/*.zip

  windows:
    name: Windows (VST3, pluginval)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DSONICGRAIN_BUILD_TESTS=ON -DSONICGRAIN_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel 3
      - name: Unit tests
        shell: bash
        run: |
          T=$(find build/Tests -name SonicGrainTests.exe -type f | head -1)
          "$T"
      - name: pluginval (strictness 8)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 900000 \
            "build/SonicGrain_artefacts/$BUILD_TYPE/VST3/SONIC GRAIN.vst3"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME//\//-}"
          cd "build/SonicGrain_artefacts/$BUILD_TYPE/VST3"
          7z a -tzip "$GITHUB_WORKSPACE/dist/SonicGrain-$TAG-Windows-VST3.zip" "SONIC GRAIN.vst3" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SonicGrain-Windows
          path: dist/*.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SonicGrain-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SONIC GRAIN $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "SONIC GRAIN $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
